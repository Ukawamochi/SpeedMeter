# 無音・雑音サンプル（silence_samples）を有効にした学習の完走確認用の設定。
# 実装: src/spkrate/train/silence.py / src/spkrate/train/train.py
#
# これは**本番の学習ではない**。拡張あり（waveform 経路）で silence_samples を有効にしたとき、
# 学習開始前の検査を通り、無音サンプルを混ぜた学習が完走することだけを確かめる。
# 件数もエポック数も小さいので、ここで出る指標に意味は無い。
#
# 実行:
#   PYTORCH_ENABLE_MPS_FALLBACK=1 uv run python -m spkrate.train.train --config configs/exp000_silence_aug_smoke.yaml

experiment_id: exp000_silence_aug_smoke
seed: 20260921
device: mps          # CLAUDE.md「学習デバイスはmps」
runs_dir: runs
model_config: configs/model/cnn_base.yaml
notes: silence_samples 有効・拡張ありの完走確認。指標の比較には使わない

data:
  source: waveform
  dev_source: features
  features_dir: data/processed/features
  train_split: configs/splits/train.json
  dev_split: configs/splits/dev.json     # 検証は dev のみ。test.json は使わない
  max_train_clips: 256
  max_dev_clips: 256
  normalization: configs/normalization.yaml
  normalization_mode: per_mel

augment:
  enabled: true
  musan_root: data/musan

silence_samples:
  enabled: true      # それ以外は既定値（割合0.03、3種等分、-90〜-60dBFS、長さは学習クリップの分布）
  musan_root: data/musan

train:
  epochs: 1
  batch_size: 16
  loss: mse
  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip: 5.0
  num_workers: 2
  bucketing: true
  bucket_pool_batches: 20
  best_metric: mae_moras_per_sec
  log_interval: 10
  record_metrics_csv: false  # 完走確認なので results/metrics.csv には残さない
