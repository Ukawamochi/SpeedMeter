# exp018（倍速再生への追従、指示書 docs/directives/2026-09-29.md タスク2 の exp018）。
# exp016（fast_window_redraws 1）と exp017（silence_samples.ratio 0.06）の2つの変更を組み合わせる。
# 指示書の条件（exp016 と exp017 のどちらも2節の基準を満たさず、一方が雑音下、他方が追従や通常の話速域で満たした場合）に
# 当たるとして、人間の判断（2026-09-30、無音・雑音の項目を「雑音下」に含めて読む）で学習する。
# exp016 は追従と通常の話速域を、exp017 は無音・雑音（雑音下の正解0の窓 0.486）を満たした。
# ubuntu-desktop（cuda、num_workers 8）で学習する。exp017.yaml との差: experiment_id、notes、fast_window_redraws（3 → 1）だけ。
# exp016.yaml との差: experiment_id、notes、silence_samples.ratio（0.03 → 0.06）だけ。

experiment_id: exp018
seed: 20260921       # exp005 と同じ
device: cuda         # ubuntu-desktop で学習する
runs_dir: runs
model_config: configs/model/cnn_base.yaml
notes: exp015 から fast_window_redraws を 1（exp016 の変更）、silence_samples.ratio を 0.06（exp017 の変更）にした組み合わせ（指示書 2026-09-29 タスク2 の exp018）。cuda で学習する

data:
  source: windows                 # 方式B（spkrate.train.method_b）
  dev_source: dev_window_val      # 検証は dev_window の抽出50,000窓（事前計算特徴量・拡張なし）
  dev_window_val_dir: data/processed/dev_window_val
  train_clip_list: data/processed/train_selection/usable_clip_ids.txt
  train_alignments: data/processed/alignments/train.jsonl
  clips_jsonl: data/processed/clips.jsonl
  train_split: configs/splits/train.json   # test.json は使わない
  max_train_clips: null  # 学習用の一覧の全件
  max_dev_clips: null    # 検証窓の50,000窓全件で毎エポック評価する
  normalization: configs/normalization.yaml
  normalization_mode: per_mel

windows:
  window_sec: 2.0
  margin_sec: 0.5
  concat_group_size: [3, 5]      # configs/eval/dev_window.yaml と同じ
  concat_gap_sec: [0.3, 1.5]
  concat_gap_round_sec: 0.01
  fast_window_redraws: 1        # exp015・exp017 は 3。exp016 と同じ（指示書 2026-09-29 タスク2 の exp018）
  fast_window_min_rate: 10.0    # 既定値

augment:
  enabled: true      # AugmentConfig の既定値（exp004 と同じ）
  musan_root: data/musan
  musan_noise_split: configs/splits/musan_noise.json   # MUSAN noise の学習用だけ
  params:
    time_stretch_range: [0.5, 1.5]           # exp005 は既定の 0.7〜1.5。冒頭のコメント
    time_stretch_distribution: log_uniform   # exp005 は既定の uniform（params なし）

silence_samples:
  enabled: true      # それ以外は exp004 と同じ既定値（割合0.03、3種等分、-90〜-60dBFS、長さは学習入力＝2.0秒）
  musan_root: data/musan
  musan_noise_split: configs/splits/musan_noise.json
  ratio: 0.06        # 既定（spec.md、exp015）は 0.03。指示書 2026-09-29 タスク2 の exp017（新しい実験の設定でだけ使う）

train:
  max_epochs: 30                  # 上限（初期状態からエポック1〜30）
  early_stopping_patience: 5      # 検証の mae_moras_per_sec が5エポック連続で改善しなければ終了
  batch_size: 64
  loss: mse
  learning_rate: 0.0001
  weight_decay: 0.0
  grad_clip: 5.0
  num_workers: 8    # exp005 は 4。指示書 0節4（冒頭のコメント。12 は available が 2GiB を切ったのでやり直した）
  bucketing: false   # 全件201フレームなので長さの整列はしない
  best_metric: mae_moras_per_sec
  log_interval: 200
  # results/metrics.csv への追記は学習後の評価で行う。
  record_metrics_csv: false
