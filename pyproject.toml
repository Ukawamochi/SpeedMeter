[project]
name = "speakmeter"
version = "0.1.0"
description = "日本語音声から話速（毎秒モーラ数）をリアルタイムに推定する小型CNN"
readme = "README.md"
authors = [
    { name = "Ukawamochi", email = "206811198+Ukawamochi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "audiotsm>=0.1.2",
    "faster-whisper>=1.2.0",
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "onnx>=1.23.0",
    "onnxruntime>=1.30.0",
    "pandas>=3.0.6",
    "pyopenjtalk>=0.4.1",
    "pyroomacoustics>=0.10.1",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "sounddevice>=0.5.6",
    "soundfile>=0.14.0",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "tqdm>=4.70.1",
    "transformers>=5.17.0",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "spkrate"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

# Linux（ubuntu-desktop、RTX 3060・ドライバ 595・CUDA 13.2）では PyTorch 公式の cu130 版の
# torch・torchaudio を使う。macOS では従来どおり PyPI の torch・torchaudio（mps）を使う。
# cu130 は torch 2.14.0 と torchaudio 2.11.0 の両方があり、macOS と同じ版にそろえられる
# （cu132 には torchaudio 2.11.0 が無い）。docs/directives/2026-09-26-rtx3060.md タスク2。
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
pythonpath = ["src"]
